<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Timi email verification.">
  <title>Verify · Timi</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Timi">
        <span class="brand-mark" aria-hidden="true">t</span>
        <span class="brand-name">timi</span>
      </a>
    </header>
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Verify your email</h1>
      <p class="intro" id="intro">Enter your email to receive a verification code.</p>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <form id="verification-form">
        <input type="hidden" name="session" id="session">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="name@example.com" required>
        <button id="submit-button" type="submit">
          <span class="button-label">Continue</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
      <form id="code-form" hidden>
        <label for="code">Verification code</label>
        <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" required>
        <button id="verify-button" type="submit">
          <span class="button-label">Verify email</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <button id="change-email" class="secondary-button" type="button">Change email</button>
      </form>
      <p class="footnote" id="footnote">The code expires in 10 minutes.</p>
    </section>
  </main>
</body>
</html>
