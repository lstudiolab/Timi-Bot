<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Secure email verification for Timi Discord servers.">
  <title>Verify your email · Timi</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">T</div>
      <p class="eyebrow">TIMI ACCOUNT SECURITY</p>
      <h1 id="page-title">Verify your email</h1>
      <p class="intro">Confirm your email address to continue verification in Discord.</p>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <form id="verification-form" method="post" action="/api/request-code">
        <input type="hidden" name="session" id="session">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required>
        <button id="submit-button" type="submit"><span class="button-label">Send verification code</span><span class="spinner" aria-hidden="true"></span></button>
      </form>
      <div class="security-note"><span class="lock" aria-hidden="true">⌑</span><span>Your code expires in 10 minutes. Never share it with anyone. After receiving it, return to Discord and use <strong>/verifycode</strong>.</span></div>
      <footer>Secure verification powered by Timi</footer>
    </section>
  </main>
</body>
</html>
