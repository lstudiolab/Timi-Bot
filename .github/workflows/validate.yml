name: Validate

on:
  push:
    branches: [main, recovery-sqlite-compressed]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          for file in index.js bot-protection.js recovery-backup.js commands/*.js; do
            node --check "$file"
          done
