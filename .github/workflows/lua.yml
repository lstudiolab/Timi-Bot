name: Lua validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Check Lua syntax
        run: |
          find . -name '*.lua' -not -path './deps/*' -print0 | while IFS= read -r -d '' file; do
            luajit -b "$file" /tmp/timi-check.ljbc
          done
      - name: Run unit tests
        run: luajit tests/run.lua
