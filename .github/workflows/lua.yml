name: Lua validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Check Lit package metadata
        run: |
          luajit -e 'local p = assert(loadfile("package.lua"))(); assert(p.name == "lstudiolab/timi-bot"); assert(p.version); assert(#p.dependencies >= 3); print("Lit package metadata OK")'
      - name: Check Lua syntax
        run: |
          find . -name '*.lua' -not -path './deps/*' -print0 | while IFS= read -r -d '' file; do
            luajit -b "$file" /tmp/timi-check.ljbc
          done
      - name: Check Termux installer syntax
        run: bash -n scripts/termux-setup.sh
      - name: Run unit tests
        run: luajit tests/run.lua
